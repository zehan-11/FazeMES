<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>天工开物 · 电风扇 | FazeMES</title>
<link rel="icon" type="image/svg+xml" href="../fazemes-logo.svg">
<style>html,body,#host-works{height:100%;width:100%;margin:0;background:#04060a;color-scheme:dark}body{overflow:hidden}</style>
</head><body><div id="host-works"></div>
<template id="tpl-loom">
<style>
/* Layout: 三栏作战大屏 —— 顶部正中是「总控卫星」，下方 8 台造型各异的织机（= 子 Agent）由牵引线挂在总控主环上，
   向下吐出彩色光丝，汇入中部「织机光梁」的 7 个织位（织片 = 子任务），再由织位垂下的丝线在底部织造台上一针一针织出当前项目。
   左栏机组阵列 + 执行代码，右栏织造项目 / 事件流 / 交付记录。左上标题、右上按钮与前几款同一套写法。
   机械与织造台是原生 WebGL（不依赖 three.js），光丝画在 2D 画布上。深空单一深色。 */
:host{
  color-scheme:dark;
  --bg:#04060a; --panel:rgba(8,11,17,.82); --card:rgba(5,8,12,.78);
  --line:rgba(150,180,220,.13); --line-2:rgba(170,200,240,.28);
  --fg:#dae2ee; --fg-2:#98a4b5; --fg-3:#5c6777;
  --ice:#9cd0ff; --silk:#ffb98a; --ok:#86e3b6; --ink:#06080b;
  --display:"Syncopate","Noto Sans SC",system-ui,sans-serif;
  --mono:"JetBrains Mono","Noto Sans SC","PingFang SC",ui-monospace,Menlo,monospace;
  --cjk:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
:host{display:block;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--mono);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
*{box-sizing:border-box}
.gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.gl.drag{cursor:grabbing}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 80% at 50% 46%,transparent 56%,rgba(0,0,0,.55) 100%)}
.fx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.nr{position:absolute;inset:0;pointer-events:none}
.fit{position:absolute;inset:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.fit-in{position:relative;width:100%;height:100%}
.board{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,.5));pointer-events:none}
.pe{pointer-events:auto}

/* ---------- 左上标题（与 03–06 同款） ---------- */
.topfade{position:absolute;left:-40px;top:0;width:900px;height:330px;background:radial-gradient(ellipse 700px 300px at 0 0,rgba(2,4,8,.92),rgba(2,4,8,.55) 55%,rgba(2,4,8,0) 85%)}
.hd{position:absolute;left:24px;top:18px;width:max-content;text-shadow:0 0 6px var(--bg),0 0 14px var(--bg)}
.eb{width:max-content;font-size:10px;letter-spacing:.26em;color:var(--fg-3);white-space:nowrap}
.eb b{color:var(--ice);font-weight:500}
.hd h1{margin:12px 0 0;font-family:var(--display);font-weight:700;font-size:44px;line-height:1.06;letter-spacing:.05em;color:var(--fg)}
.hd h1 span{display:block;width:max-content;white-space:nowrap}
.hd h1 .l1{display:flex;align-items:center;width:max-content}
.hd h1 em{font-style:normal;font-family:var(--cjk);font-weight:900;font-size:36px;line-height:1;letter-spacing:.08em;margin-left:22px;text-shadow:none;background:linear-gradient(90deg,#b8dcff,#ffc29a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 10px rgba(255,185,138,.3))}
.sub{width:max-content;margin-top:12px;font-family:var(--cjk);font-size:14px;letter-spacing:.06em;color:var(--fg-2);white-space:nowrap}
.sub2{width:max-content;margin-top:6px;font-size:10px;letter-spacing:.16em;color:var(--fg-3);white-space:nowrap}
.sub2 b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- 右上按钮（与 03–06 同款） ---------- */
.tools{position:absolute;right:24px;top:14px;display:flex;gap:6px}
button.tb{font:500 11px/1 var(--mono);letter-spacing:.1em;color:var(--fg-2);background:rgba(6,9,14,.75);border:1px solid rgba(160,195,235,.3);padding:8px 11px;cursor:pointer;white-space:nowrap}
button.tb b{color:var(--fg);font-weight:700;font-family:var(--cjk);margin-left:6px;letter-spacing:.04em}
button.tb:hover{border-color:var(--ice);color:var(--fg)}
button.tb:focus-visible{outline:1px solid var(--ice);outline-offset:2px}
.strip{position:absolute;right:24px;top:52px;display:flex;gap:16px;font-size:9.5px;letter-spacing:.12em;color:var(--fg-3);white-space:nowrap}
.strip b{color:var(--fg);font-weight:500;margin-left:5px;font-variant-numeric:tabular-nums}
.strip .live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px;box-shadow:0 0 6px var(--ok)}

/* ---------- 框体 ---------- */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.panel::before,.panel::after{content:"";position:absolute;width:9px;height:9px;pointer-events:none;border:1px solid var(--line-2);z-index:1}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.ph{flex:none;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 12px 7px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.14em;color:var(--fg-3);white-space:nowrap}
.ph>span:first-child{color:var(--fg-2);overflow:hidden;text-overflow:ellipsis}
.ph b{color:var(--fg);font-weight:500;margin-right:2px}
.bar{display:block;height:4px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c,var(--ice));opacity:.7;transition:width .12s linear}

/* 左：机组阵列 + 执行代码 */
.col-l{position:absolute;left:24px;top:206px;bottom:36px;width:384px;display:flex;flex-direction:column;gap:12px}
.swarm{flex:none;height:476px}
.sws{flex:1;display:grid;grid-template-rows:repeat(8,minmax(0,1fr));gap:5px;padding:7px 11px 9px 10px;min-height:0}
.sw{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 92px;grid-template-rows:auto auto;column-gap:10px;align-content:center;padding:3px 8px 3px 10px;background:var(--card);border:1px solid rgba(160,190,220,.08);min-height:0;transition:border-color .45s,box-shadow .45s}
.sw::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--c);opacity:.45;transition:opacity .4s}
.sw-h{display:flex;align-items:baseline;gap:7px;font-size:9.5px;line-height:14px;white-space:nowrap;min-width:0}
.sw-h .sid{color:var(--c);font-weight:700;letter-spacing:.06em}
.sw-h .nm{color:var(--fg);letter-spacing:.05em}
.sw-h .role{color:var(--fg-3);font-family:var(--cjk);font-size:9px}
.sw-t{grid-column:1;font-family:var(--cjk);font-size:10.5px;line-height:15px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw-r{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
.sw-tag{align-self:flex-end;font-size:8px;line-height:11px;letter-spacing:.12em;padding:0 5px;border:1px solid var(--line-2);color:var(--fg-3);font-family:var(--cjk);white-space:nowrap}
.sw-m{display:grid;grid-template-columns:minmax(0,1fr) 30px;gap:5px;align-items:center;font-size:8.5px;color:var(--fg-2);font-variant-numeric:tabular-nums;text-align:right}
.sw-g{display:flex;align-items:flex-end;gap:1px;height:9px}
.sw-g i{flex:1;background:var(--c);opacity:.35;min-height:1px}
.sw::after{content:"";position:absolute;right:-2px;top:18%;bottom:18%;width:2px;background:repeating-linear-gradient(to bottom,var(--c) 0 1px,transparent 1px 4px);opacity:.5;animation:lmtick .35s linear infinite}
@keyframes lmtick{from{background-position:0 0}to{background-position:0 4px}}
.sw.on{border-color:var(--c);box-shadow:inset 0 0 24px -12px var(--c)}
.sw.on::before{opacity:1}
.sw.on .sw-t{color:var(--fg)}
.sw.on .sw-tag{color:var(--c);border-color:var(--c)}
.sw.on .sw-g i{opacity:.75}
.sw.done .sw-tag{color:var(--ice)}
.codep{flex:1}
.code{flex:1;margin:0;padding:6px 10px 6px 0;list-style:none;font:400 9.5px/13.5px var(--mono);color:#7f8b9a;overflow:hidden;min-height:0}
.code.sc{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 30px);mask-image:linear-gradient(180deg,transparent 0,#000 30px)}
.code li{white-space:pre;overflow:hidden;text-overflow:ellipsis}
.code li::before{content:attr(data-n);display:inline-block;width:4ch;padding-right:12px;text-align:right;color:var(--fg-3);opacity:.75}
.code li.hl{color:var(--fg);background:linear-gradient(90deg,rgba(156,208,255,.12),transparent 90%);box-shadow:inset 2px 0 0 var(--ice)}
.code li.hl.hot{background:linear-gradient(90deg,rgba(255,185,138,.13),transparent 90%);box-shadow:inset 2px 0 0 var(--silk)}
.code li.hl::before{color:var(--fg-2);opacity:1}
.code li.cur::after{content:"\258C";color:var(--ice);margin-left:1px;animation:lmblink 1s steps(1) infinite}
.code li.cur.hot::after{color:var(--silk)}
.code li.cur.tp::after{animation:none}
@keyframes lmblink{50%{opacity:0}}
.code .xk{color:#b9a6ff}
.code .xf{color:var(--ice)}
.code .xs{color:#e8c18f}
.code .xn{color:#8fe3b9}
.code .xc{color:#66727f;font-family:var(--cjk)}

/* 中：总控机械 / 织机 / 织位 / 织造台 */
.mid{position:absolute;left:432px;right:432px;top:0;bottom:0}
.core-cap{position:absolute;left:50%;top:238px;transform:translate(-50%,-50%);font-size:9px;font-weight:500;letter-spacing:.34em;color:#f2f6ff;white-space:nowrap;text-shadow:0 0 4px #04060a,0 0 10px #04060a,0 0 18px #04060a;padding:3px 6px 3px calc(6px + .34em);background:rgba(4,6,10,.42);border:1px solid rgba(200,220,255,.18)}
.core-sub{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;align-items:baseline;gap:10px;font-size:9px;letter-spacing:.2em;color:var(--fg-3);white-space:nowrap}
.core-sub b{font-family:var(--cjk);font-size:11px;font-weight:500;letter-spacing:.14em;color:var(--fg-2)}
.core-sub i{font-style:normal;color:var(--silk)}
.ch{position:absolute;top:78px;display:flex;flex-direction:column;gap:6px;font-size:8.5px;letter-spacing:.16em;color:var(--fg-3);white-space:nowrap}
.ch.l{right:calc(50% + 236px);text-align:right;align-items:flex-end}
.ch.r{left:calc(50% + 236px)}
.ch .kv b{display:block;font-size:17px;font-weight:400;letter-spacing:.02em;color:var(--fg);font-variant-numeric:tabular-nums;margin-top:2px}
.ch .kv b small{font-size:10px;color:var(--fg-3);margin-left:3px}
.slab{position:absolute;width:132px;padding:5px 8px 6px;background:rgba(5,8,12,.82);border:1px solid rgba(160,190,220,.14);font-size:8.5px;color:var(--fg-3);transition:border-color .4s,background .4s}
.slab.l{left:6px}
.slab.r{right:6px;text-align:right}
.slab .h{display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.slab.r .h{justify-content:flex-end}
.slab .h b{color:var(--c);font-weight:700;letter-spacing:.06em}
.slab .h span{color:var(--fg-2);letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis}
.slab .t{margin-top:3px;font-family:var(--cjk);font-size:10px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slab .k{margin-top:2px;letter-spacing:.1em;white-space:nowrap;font-variant-numeric:tabular-nums}
.slab.on{border-color:var(--c);background:rgba(8,12,18,.9)}
.slab.on .t{color:var(--fg)}
.slab.on .k{color:var(--c)}
.loom{position:absolute;left:84px;right:84px;top:596px;height:74px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.lc{position:relative;display:flex;flex-direction:column;gap:3px;padding:5px 7px 6px;background:rgba(5,8,12,.84);border:1px solid rgba(160,190,220,.14);min-width:0;pointer-events:auto;cursor:pointer;font:inherit;color:inherit;text-align:left;transition:border-color .35s,background .35s,box-shadow .35s}
.lc::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;background:var(--c);opacity:.5}
.lc-h{display:flex;justify-content:space-between;gap:4px;font-size:8px;letter-spacing:.1em;color:var(--fg-3);white-space:nowrap}
.lc-h b{color:var(--c);font-weight:700}
.lc-h span{overflow:hidden;text-overflow:ellipsis}
.lc-t{font-family:var(--cjk);font-size:12px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-b{display:flex;align-items:center;gap:6px;font-size:8.5px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.lc-b .bar{flex:1;height:3px}
.lc:hover{border-color:rgba(160,190,220,.35)}
.lc:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
.lc.on{border-color:var(--c);background:rgba(10,14,20,.92);box-shadow:0 0 26px -12px var(--c),inset 0 0 18px -10px var(--c)}
.lc.on .lc-t{color:var(--fg)}
.lc.on::before{opacity:1}
.lc.done .lc-t{color:var(--fg)}
.lc.done .lc-b{color:var(--ice)}
.lc.focus{border-color:var(--fg)}
.lc.idle{opacity:.55}
.hud-b{position:absolute;left:14px;right:14px;bottom:42px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.eyebrow{font-size:9px;letter-spacing:.2em;color:var(--fg-3);margin-bottom:7px;white-space:nowrap}
.eyebrow i{display:inline-block;width:6px;height:6px;background:var(--silk);margin-right:8px;vertical-align:1px;animation:lmpulse 1.2s infinite}
.now-title{font-family:var(--cjk);font-size:28px;font-weight:700;letter-spacing:.02em;line-height:1.12;white-space:nowrap;text-shadow:0 0 12px var(--bg)}
.now-sub{font-size:10px;color:var(--fg-2);margin-top:6px;letter-spacing:.04em;font-family:var(--cjk);white-space:nowrap}
.hud-br{text-align:right}
.big{font-family:var(--mono);font-size:44px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums;color:var(--fg);letter-spacing:-.02em}
.big small{font-size:16px;color:var(--fg-3);margin-left:4px}
.cap{font-size:8.5px;letter-spacing:.18em;color:var(--fg-3);margin-top:6px;white-space:nowrap}
.hint{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);font-size:8.5px;letter-spacing:.14em;color:var(--fg-3);opacity:.7;white-space:nowrap}
@keyframes lmpulse{0%,100%{opacity:1}50%{opacity:.3}}

/* 右：织造项目 / 事件流 / 交付 */
.col-r{position:absolute;right:24px;top:80px;bottom:36px;width:384px;display:flex;flex-direction:column;gap:12px}
.proj{flex:none;height:548px}
.pj{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 12px 9px;border-bottom:1px solid var(--line)}
.pj-id{font-size:9px;letter-spacing:.16em;color:var(--fg-3);white-space:nowrap}
.pj-pct{font-size:9px;color:var(--fg-2);text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.pj-t{grid-column:1/-1;font-family:var(--cjk);font-size:17px;font-weight:700;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj-bar{grid-column:1/-1;height:3px;background:rgba(255,255,255,.07);position:relative;overflow:hidden;margin-top:2px}
.pj-bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--ice),var(--silk))}
.steps{list-style:none;margin:0;padding:9px 12px 8px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;border-bottom:1px solid var(--line)}
.steps li{position:relative;display:flex;flex-direction:column;gap:1px;padding-bottom:6px;font-size:8px;color:var(--fg-3);letter-spacing:.1em;white-space:nowrap;transition:color .4s}
.steps .sl{font-family:var(--cjk);font-size:12px;letter-spacing:.08em}
.steps i{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(160,190,220,.14)}
.steps i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--fg-2);transform-origin:left center;transform:scaleX(var(--p,0))}
.steps li.done{color:var(--fg-2)}
.steps li.on{color:var(--fg)}
.steps li.on i::after{background:var(--ice);box-shadow:0 0 6px var(--ice)}
.steps li.on.hot i::after{background:var(--silk);box-shadow:0 0 6px var(--silk)}
.pm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:8px 12px 9px;border-bottom:1px solid var(--line)}
.pm div{display:flex;flex-direction:column;gap:2px;min-width:0}
.pm span{font-size:8px;letter-spacing:.12em;color:var(--fg-3);white-space:nowrap;font-family:var(--cjk)}
.pm b{font-size:15px;font-weight:400;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.pm b small{font-size:9px;color:var(--fg-3);margin-left:2px}
.secs{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;padding:4px 12px 6px;min-height:0}
.sr{display:grid;grid-template-columns:18px minmax(0,1fr) 74px 34px;gap:8px;align-items:center;padding:3px 0;font-size:9px;color:var(--fg-3);border-bottom:1px dashed rgba(160,190,220,.08);cursor:pointer;pointer-events:auto;background:none;border-left:0;border-right:0;border-top:0;font-family:inherit;text-align:left}
.sr:last-child{border-bottom:0}
.sr .i{color:var(--fg-3);font-variant-numeric:tabular-nums}
.sr .n{display:flex;flex-direction:column;min-width:0}
.sr .n b{font-family:var(--cjk);font-size:11.5px;font-weight:500;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .n span{font-size:8.5px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.06em}
.sr .n span em{font-style:normal;color:var(--c)}
.sr .bar{height:3px}
.sr .p{text-align:right;color:var(--fg-2);font-variant-numeric:tabular-nums}
.sr.on .n b{color:var(--fg)}
.sr.on .p{color:var(--c)}
.sr.done .p{color:var(--ice)}
.sr.done .bar i{background:var(--ice)}
.sr.focus .n b{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.sr:focus-visible{outline:1px solid var(--fg);outline-offset:1px}
.ev{flex:1}
.heat{flex:1;position:relative;margin:9px 12px 8px;min-height:0}
.heat canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.log{flex:1;padding:6px 12px;font-size:9px;line-height:16.5px;overflow:hidden;color:var(--fg-3);min-height:0}
.lr{display:grid;grid-template-columns:52px 62px minmax(0,1fr);gap:8px;white-space:nowrap}
.lr .a{color:var(--c)}
.lr .x{color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;font-family:var(--cjk)}
.lr.fresh .x{color:var(--fg)}
.deliv{flex:none;height:150px}
.dl{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;padding:3px 12px 6px;font-size:9px}
.dr{display:grid;grid-template-columns:38px 64px minmax(0,1fr) 38px;gap:9px;padding:3px 0;border-bottom:1px dashed rgba(160,190,220,.09);color:var(--fg-3);align-items:baseline;white-space:nowrap}
.dr:last-child{border-bottom:0}
.dr .t{color:var(--fg-2);font-family:var(--cjk);font-size:10.5px;overflow:hidden;text-overflow:ellipsis}
.dr .d{text-align:right;font-variant-numeric:tabular-nums}
.dr.new{animation:lmflash 2.2s ease-out}
.dr.new .t{color:var(--fg)}
@keyframes lmflash{0%{background:rgba(255,185,138,.18)}100%{background:transparent}}
