<html lang="zh-CN"
  ><head
    ><meta charset="UTF-8" /><meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    /><title>FazeMES · 生产智能协同中心</title
    ><link rel="icon" href="../fazemes-logo.svg" /><style>
      html,
      body,
      #host-works {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #04060a;
      }
      body {
        overflow: hidden;
      }
    </style></head
  >
  <body
    ><div id="host-works"></div
    ><template id="tpl-loom"
      ><style>
        :host {
          --bg: #04060a;
          --panel: rgba(8, 13, 20, 0.94);
          --line: #243340;
          --mute: #a2b1c3;
          --ink: #e2edf5;
          --ice: #9cd0ff;
          --warm: #ffb98a;
          --cjk: 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
          --mono: 'JetBrains Mono', Consolas, monospace;
          display: block;
          position: relative;
          height: 100%;
          width: 100%;
          overflow: hidden;
          font: 14px/1.5 var(--cjk);
          color: var(--ink);
          background: var(--bg);
          color-scheme: dark;
        }
        * {
          box-sizing: border-box;
        }
        [hidden] {
          display: none !important;
        }
        button,
        input,
        select,
        textarea {
          font: inherit;
          color: inherit;
        }
        button {
          cursor: pointer;
        }
        button:disabled {
          opacity: 0.48;
          cursor: default;
        }
        button:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
          outline: 2px solid var(--ice);
          outline-offset: 2px;
        }
        button {
          touch-action: manipulation;
        }
        .gl,
        .fx,
        .nr,
        .fit,
        .fit-in,
        .overlay {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
        .gl {
          cursor: grab;
          touch-action: none;
        }
        .gl.drag {
          cursor: grabbing;
        }
        .fx,
        .nr,
        .overlay {
          pointer-events: none;
        }
        .fit {
          padding: 0 16px;
        }
        .fit-in {
          position: relative;
        }
        .board {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 1920px;
          height: 1080px;
          transform: translate(-50%, -50%) scale(var(--s, 0.5));
          pointer-events: none;
        }
        .mid {
          position: absolute;
          inset: 0 390px;
        }
        .loom {
          position: absolute;
          top: 51%;
          left: 3%;
          right: 3%;
          display: grid;
          grid-template-columns: repeat(7, minmax(0, 1fr));
          gap: 7px;
          height: 61px;
          pointer-events: auto;
        }
        .part-card {
          min-width: 0;
          padding: 6px 5px;
          text-align: left;
          background: #080f16df;
          border: 1px solid #2c3b47;
          border-top: 2px solid var(--accent);
          color: var(--ink);
        }
        .part-card b,
        .part-card small {
          display: block;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .part-card b {
          font-size: 16px;
        }
        .part-card small {
          font: 12px var(--cjk);
          color: #b0bfd0;
          margin-top: 4px;
        }
        .part-card[data-state='short'] {
          border-color: #ed995a;
        }
        .part-card[data-state='short'] small {
          color: var(--warm);
        }
        .controls {
          position: absolute;
          top: 17px;
          right: 20px;
          display: flex;
          gap: 5px;
          align-items: center;
        }
        .btn,
        .chip,
        .row-btn {
          border: 1px solid #354551;
          color: #dce8f4;
          background: #0b131be8;
          padding: 6px 10px;
          border-radius: 3px;
        }
        .btn:hover,
        .row-btn:hover,
        .chip:hover {
          border-color: #8da8ba;
        }
        .btn.primary {
          background: #c1dfeb;
          color: #101923;
          border-color: #d1ecf4;
          font-weight: 650;
        }
        .btn,
        .chip {
          font-size: 12px;
        }
        .btn.warm {
          border-color: #886549;
          color: #ffd3aa;
        }
        .controls .btn {
          font-size: 11px;
        }
        .side {
          position: absolute;
          top: 84px;
          bottom: 38px;
          width: clamp(202px, 20vw, 320px);
          display: flex;
          flex-direction: column;
          overflow: auto;
          scrollbar-width: thin;
          scrollbar-color: #34485a transparent;
          background: linear-gradient(160deg, rgba(11, 18, 26, 0.96), rgba(6, 10, 15, 0.87));
          border: 1px solid var(--line);
          border-radius: 4px;
          overscroll-behavior: contain;
        }
        .side.left {
          left: 20px;
        }
        .side.right {
          right: 20px;
        }
        .group {
          padding: 14px;
          border-bottom: 1px solid #20303a;
        }
        .group:last-child {
          border-bottom: 0;
        }
        .side h2,
        .side h3 {
          font-size: 14px;
          margin: 0 0 9px;
          font-weight: 650;
        }
        .side h2 {
          letter-spacing: 0.04em;
        }
        .side p {
          font-size: 13px;
          white-space: pre-line;
          overflow-wrap: anywhere;
          line-height: 1.65;
          margin: 5px 0;
          color: #c0ceda;
        }
        .side .muted,
        .meta {
          color: #a0b0bf;
          font-size: 11px;
        }
        .form {
          display: grid;
          gap: 9px;
        }
        .form label {
          display: grid;
          gap: 4px;
          color: #b6c5d2;
          font-size: 12px;
        }
        .form textarea,
        .form select {
          border: 1px solid #334552;
          background: #0b141d;
          padding: 7px;
          border-radius: 3px;
          resize: vertical;
          width: 100%;
        }
        .form textarea {
          min-height: 62px;
          max-height: 140px;
        }
        .actions {
          display: flex;
          gap: 6px;
          flex-wrap: wrap;
        }
        .row-btn {
          display: block;
          width: 100%;
          text-align: left;
          font-size: 12px;
          padding: 7px 9px;
          margin: 4px 0;
          white-space: normal;
          overflow-wrap: anywhere;
        }
        .row-btn small {
          display: block;
          color: #a1b1c2;
          font-size: 11px;
        }
        .row-btn.short,
        .row-btn[aria-current='true'] {
          border-left: 2px solid var(--warm);
        }
        .row-btn.short {
          color: #ffbd90;
        }
        .list {
          list-style: none;
          margin: 0;
          padding: 0;
        }
        .list li {
          border-left: 1px solid #496171;
          padding: 0 0 9px 9px;
          font-size: 12px;
          color: #c0d0de;
          white-space: pre-line;
          overflow-wrap: anywhere;
        }
        .list li:last-child {
          padding-bottom: 0;
        }
        .list strong {
          display: block;
          font-weight: 600;
          color: var(--ink);
        }
        .status {
          color: #a7d7d5;
          font-size: 12px;
        }
        #answer {
          max-height: 12em;
          overflow: auto;
          scrollbar-width: thin;
        }
        #answer-links:not(:empty) {
          margin: 8px 0;
        }
        .short-text {
          color: var(--warm) !important;
        }
        .report {
          border-left: 2px solid var(--ice);
          padding-left: 8px;
        }
        .master,
        .sat-label,
        .part-pin {
          position: absolute;
          transform: translate(-50%, 0);
          pointer-events: auto;
          white-space: nowrap;
          font-family: var(--cjk);
          text-align: center;
          border: 1px solid #3c5365;
          border-radius: 3px;
          background: #081019eb;
          color: var(--ink);
        }
        .master {
          padding: 4px 11px;
          border-top: 2px solid #e5bb86;
        }
        .master strong,
        .sat-label strong {
          display: block;
          font-size: clamp(11px, 0.88vw, 14px);
          font-weight: 620;
        }
        .master small,
        .sat-label span {
          display: block;
          font-size: 10px;
          color: #b6c7d5;
        }
        .sat-label {
          border-top: 2px solid var(--accent);
          padding: 4px 7px;
        }
        .sat-label.active {
          box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 36%, transparent);
          border-color: var(--accent);
        }
        .sat-label.active span {
          color: var(--accent);
        }
        .part-pin {
          max-width: min(36vw, 190px);
          overflow: hidden;
          text-overflow: ellipsis;
          transform: translate(-50%, -50%);
          background: #2c1911;
          border: 1px solid #e89151;
          color: #ffcfaa;
          font-size: 12px;
          padding: 4px 8px;
        }
        .foot {
          position: absolute;
          left: 22px;
          right: 22px;
          bottom: 8px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 8px;
          pointer-events: none;
          font-size: 10px;
          color: var(--mute);
        }
        .mobile-nav {
          display: none;
        }
        .inspector {
          position: absolute;
          left: 50%;
          bottom: 5%;
          transform: translateX(-50%);
          display: flex;
          gap: 5px;
          align-items: center;
          border: 1px solid var(--line);
          padding: 6px;
          border-radius: 3px;
          background: #0c151e;
        }
        .inspector span {
          font-size: 12px;
        }
        .glfail {
          position: absolute;
          top: 46%;
          left: 50%;
          transform: translateX(-50%);
          background: #17202a;
          padding: 8px;
          border: 1px solid var(--line);
          font-size: 12px;
        }
        .view-card {
          position: absolute;
          left: 50%;
          top: 51%;
          transform: translateX(-50%);
          width: min(42%, 580px);
          padding: 10px 16px;
          border: 1px solid #4b6b78;
          border-top: 2px solid #a2dcd5;
          border-radius: 4px;
          background: #09131cf2;
          box-shadow: 0 8px 22px #0006;
          color: var(--ink);
          text-align: left;
          pointer-events: auto;
        }
        .view-card b, .view-card strong, .view-card small { display: block; }
        .view-card b { color: #a9cdcf; font-size: 11px; font-weight: 500; }
        .view-card strong { font-size: clamp(15px, 1.45vw, 24px); line-height: 1.3; margin: 3px 0; }
        .view-card small { color: #c2d0d9; font-size: 11px; overflow-wrap: anywhere; }
        :host([data-view]) .loom { visibility: hidden; }
        .part-pin.inspect { background: #0e292c; border-color: #72d4cc; color: #c8f5ee; }
        @media (min-width:861px) and (min-aspect-ratio:1/1) {
          :host([data-product-view]) .view-card { display:grid; grid-template-columns:minmax(100px,1fr) auto; align-items:center; gap:0 12px; }
          :host([data-product-view]) .view-card > :is(b,strong,small) { grid-column:1; }
          :host([data-product-view]) #view-choices { grid-column:2; grid-row:1 / 4; margin:0; max-width:230px; justify-content:flex-end; }
        }
        #view-choices { margin-top: 7px; }
        #view-choices:empty { display:none; }
        #view-choices .chip, #examples .chip { min-height: 30px; font-size: 11px; }
        :host([data-list-only]) .view-card { top: 58%; }
        @media (max-width:860px), (max-aspect-ratio:1/1) {
          .view-card, :host([data-list-only]) .view-card { top:44%; width: min(90%, 470px); padding: 6px 10px; }
          :host([data-product-view]) .view-card { top:auto; bottom:55px; max-height:25%; overflow:auto; }
          .view-card strong { font-size:15px; }
          .view-card .actions { gap:4px; }
        }
        :host([data-list-only]) .loom {
          visibility: hidden;
        }
        :host([data-run]) .demo-control {
          display: none;
        }
        @media (max-width: 860px), (max-aspect-ratio: 1/1) {
          .controls {
            top: 10px;
            right: 9px;
            max-width: 61%;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 3px;
          }
          .controls .btn {
            font-size: 10px;
            padding: 4px 6px;
          }
          .side {
            display: none;
            width: auto;
            left: 8px !important;
            right: 8px !important;
            bottom: 45px;
            top: auto;
            max-height: 44%;
            z-index: 7;
            background: #09121bf8;
          }
          .side.open {
            display: flex;
          }
          .group {
            padding: 10px;
          }
          .mobile-nav {
            display: flex;
            position: absolute;
            bottom: 7px;
            left: 50%;
            transform: translateX(-50%);
            gap: 8px;
            white-space: nowrap;
          }
          .foot {
            bottom: 44px;
            left: 10px;
            right: 10px;
          }
          .loom {
            visibility: hidden;
          }
          .sat-label {
            padding: 3px 4px;
          }
          .sat-label strong {
            font-size: 10px;
          }
          .sat-label span,
          .master small {
            font-size: 8px;
          }
          .master strong {
            font-size: 11px;
          }
          .part-pin {
            font-size: 10px;
            padding: 3px 5px;
          }
          .inspector {
            bottom: 12%;
            max-width: 94%;
            white-space: nowrap;
            z-index: 8;
          }
          .inspector .btn {
            font-size: 10px;
            padding: 4px;
          }
          .inspector span {
            font-size: 10px;
          }
        }
      </style>
      <link rel="stylesheet" href="./question-flow.css" />
      <canvas
        class="gl"
        id="gl"
        aria-label="FazeMES 卫星协同与风扇装配，可以拖动旋转、滚轮缩放"
      ></canvas
      ><canvas class="fx" id="fx" aria-hidden="true"></canvas>
      <div class="nr" id="nr"
        ><div class="fit"
          ><div class="fit-in" id="fitIn"
            ><div class="board" id="board"
              ><main class="mid" id="mid"
                ><div class="loom" id="loom" aria-label="风扇部件"></div></main></div></div></div
      ></div>
      <nav class="controls" aria-label="场景控制"
        ><button class="btn demo-control" data-act="inspect">看完整风扇</button
        ><button class="btn" id="stage-mode" hidden>查看零件模型</button
        ><button class="btn" id="back" hidden>返回装配演示</button
        ><button class="btn" data-act="full" data-f="full">全屏</button></nav
      >
      <div class="overlay"
        ><button class="master" id="master-label"
          ><strong>生产协同调度 Agent</strong
          ><small>总 Agent · <span id="coreSt">准备装配</span></small></button
        ><div id="agent-labels"></div><div id="part-pins"></div
      ></div>
      <section class="view-card" id="view-card" aria-live="polite" hidden><b id="view-heading"></b><strong id="view-value"></strong><small id="view-caption"></small><div class="actions" id="view-choices"></div></section>
      <section id="flow-stage" aria-label="本轮协同" hidden>
        <section id="flow-code" hidden>
          <header><span class="terminal-mark" aria-hidden="true">›_</span><strong id="flow-agent"></strong><span class="trace-label">执行终端</span></header>
          <div class="terminal-body"><p id="flow-action" role="status"></p>
            <pre id="terminal-viewport" tabindex="0" aria-label="本轮终端输出"><code id="flow-lines"></code></pre>
          </div>
        </section>
        <article id="flow-paper" aria-label="本轮问答报告" hidden>
          <div id="paper-ink"><header><span>FazeMES</span><small id="paper-status"></small></header>
          <div id="paper-body" tabindex="0">
            <h2 id="paper-title"></h2><p id="paper-question"></p>
            <p id="paper-answer"></p><div id="paper-evidence" class="actions"></div>
            <div id="paper-choices" class="actions"></div>
          </div>
          <footer id="paper-source"></footer></div>
        </article>
      </section>
      <canvas id="flow-particles" aria-hidden="true"></canvas>
      <aside class="side left" id="chat"
        ><section class="group"
          ><h2>智能问答</h2
          ><div class="form" id="online-form" hidden
            ><label>提问<textarea id="question" rows="2" maxlength="4000" placeholder="问产品、工单，或知识库里的问题"></textarea></label>
            <div class="actions" id="examples" aria-label="常用提问"></div>
            <details id="source-settings"><summary>查询方式</summary><label>资料来源<select id="reference">
              <option value="auto">总 Agent 自动判断</option><option value="knowledge">知识助手 · 当前设置</option>
              <option value="evidence">仅检索知识证据</option><option value="graph">知识助手 · 图谱</option><option value="hybrid">知识助手 · 混合检索</option>
              <option value="business">业务工具</option><option value="kitting-doc">工单齐套与已发布规程</option><option value="dify">Dify 项目手册</option>
            </select></label><button class="chip" id="knowledge-settings" hidden>知识库与检索设置</button></details>
            <button class="btn" id="choose">选择工单</button
            ><button class="btn primary" id="ask">发送给总 Agent</button></div
          ><p id="offline-note">请进入 FazeMES 的 Agent 协同页提问。</p></section
        >
        <section class="group"
          ><h3 id="context-title">装配演示</h3><p id="run-question">台式电风扇 · 七部件装配</p
          ><p class="status" id="run-stage"></p><p id="answer" aria-live="polite" tabindex="-1"></p
          ><div class="actions" id="answer-links"></div
          ><div class="actions"
            ><button class="btn" id="report" hidden>生成缺料报告</button
            ><button class="btn" id="review" hidden>重新核对</button
            ><button class="btn" id="resolve" hidden>模拟补齐</button></div
          ></section
        >
        <section class="group" id="report-section" hidden
          ><h3>本轮缺料报告</h3><p class="report" id="report-text"></p></section
        ><section class="group"
          ><h3>工具调用与执行记录</h3><ol class="list" id="events"></ol></section
      ></aside>
      <aside class="side right" id="evidence"
        ><section class="group"><h2 id="detail-heading">调度与分工</h2><p id="detail"></p></section
        ><section class="group"
          ><h3 id="materials-title">装配部件</h3><div id="materials"></div></section
        ><section class="group" id="history-panel" hidden
          ><h3>本轮证据</h3><div id="history"></div></section
      ></aside>
      <section id="part-inspector" class="inspector" hidden
        ><span id="part-caption"></span><button class="btn" id="prev">上一件</button
        ><button class="btn" id="next">下一件</button
        ><button class="btn" id="replay">重播装配</button></section
      >
      <div class="foot"><span id="assembly-state">准备装配</span></div>
      <nav class="mobile-nav"
        ><button class="btn" id="toggle-chat">智能问答</button
        ><button class="btn" id="toggle-evidence">本轮依据</button></nav
      ><div class="glfail" id="glFail" hidden
        >当前浏览器无法显示 WebGL 场景。问答与物料明细仍可使用。</div
      > </template
    ><script src="./fan-model.js"></script
    ><script src="./loom.js"></script
    ><script src="./report-particles.js"></script
    ><script src="./question-flow.js"></script
    ><script src="./fan-view.js"></script></body
></html>
