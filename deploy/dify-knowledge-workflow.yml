      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: knowledge-retrieval
      id: 10100-source-10101
      source: '10100'
      sourceHandle: source
      target: '10101'
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: knowledge-retrieval
        targetType: if-else
      id: 10101-source-10102
      source: '10101'
      sourceHandle: source
      target: '10102'
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: http-request
      id: 10103-source-10104
      source: '10103'
      sourceHandle: source
      target: '10104'
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: code
      id: 10104-source-10105
      source: '10104'
      sourceHandle: source
      target: '10105'
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: 10105-source-10107
      source: '10105'
      sourceHandle: source
      target: '10107'
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: template-transform
        targetType: end
      id: 10106-source-10108
      source: '10106'
      sourceHandle: source
      target: '10108'
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: code
      id: 10102-true-10103
      source: '10102'
      sourceHandle: 'true'
      target: '10103'
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: template-transform
      id: 10102-false-10106
      source: '10102'
      sourceHandle: 'false'
      target: '10106'
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: ''
        title: 输入设备问题
        type: start
        variables:
        - label: 设备问题
          max_length: 300
          options: []
          required: true
          type: text-input
          variable: question
      height: 105
      id: '10100'
      position:
        x: 0
        y: 160
      positionAbsolute:
        x: 0
        y: 160
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        dataset_ids:
        - pQw7G+d9Wx2UZC//2RNGkHgoqCJkO7C59Ukrn1iRa1Wvk1/tPqcQkDWBdoVQXkSf
        desc: ''
        metadata_filtering_mode: disabled
        multiple_retrieval_config:
          reranking_enable: false
          top_k: 3
        query_variable_selector:
        - '10100'
        - question
        retrieval_mode: multiple
        title: 检索点检手册
        type: knowledge-retrieval
      height: 105
      id: '10101'
      position:
        x: 290
        y: 160
      positionAbsolute:
        x: 290
        y: 160
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: not empty
            id: match
            value: ''
            varType: array[object]
            variable_selector:
            - '10101'
            - result
          logical_operator: and
        desc: ''
        title: 找到参考片段？
        type: if-else
      height: 105
      id: '10102'
      position:
        x: 580
        y: 160
      positionAbsolute:
        x: 580
        y: 160
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\ndef main(question, hits):\n    sources = []\n    for\
          \ index, item in enumerate(hits, 1):\n        metadata = item.get(\"metadata\"\
          ) or {}\n        title = metadata.get(\"document_name\") or item.get(\"\
          title\") or \"点检手册\"\n        sources.append(\"[{}] {}：{}\".format(index,\
          \ title, item.get(\"content\", \"\")))\n    evidence = \"\\n\".join(sources)\n\
          \    prompt = \"请用一句中文回答问题，只复述下列参考资料明确记载的事项。资料不足时请说明。\\n资料：{}\\n问题：{}\"\
          .format(evidence, question)\n    body = {\"model\": \"qwen2.5:0.5b\", \"\
          stream\": False, \"prompt\": prompt,\n            \"options\": {\"temperature\"\
          : 0, \"num_predict\": 160}}\n    return {\"body\": json.dumps(body, ensure_ascii=False),\
          \ \"sources\": evidence}\n"
        code_language: python3
        desc: ''
        outputs:
          body:
            children: null
            type: string
          sources:
            children: null
            type: string
        title: 整理出处与模型输入
        type: code
        variables:
        - value_selector:
          - '10100'
          - question
          variable: question
        - value_selector:
          - '10101'
          - result
          variable: hits
      height: 105
      id: '10103'
      position:
        x: 880
        y: 45
      positionAbsolute:
        x: 880
        y: 45
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          type: no-auth
        body:
          data:
          - id: body
            key: ''
            type: text
            value: '{{#10103.body#}}'
          type: raw-text
        desc: ''
        headers: Content-Type:application/json
        method: post
        params: ''
        ssl_verify: true
        timeout:
          connect: 10
          read: 150
          write: 30
        title: 本机 Qwen 生成回答
        type: http-request
        url: http://host.docker.internal:11434/api/generate
      height: 105
      id: '10104'
      position:
        x: 1180
        y: 45
      positionAbsolute:
        x: 1180
        y: 45
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\ndef main(body):\n    result = json.loads(body)\n   \
          \ answer = result.get(\"response\", \"\").strip()\n    if not result.get(\"\
          done\") or not answer:\n        raise ValueError(\"本机模型未返回完整回答\")\n    return\
          \ {\"answer\": answer}\n"
        code_language: python3
        desc: ''
        outputs:
          answer:
            children: null
            type: string
        title: 读取模型答复
        type: code
        variables:
        - value_selector:
          - '10104'
          - body
          variable: body
      height: 105
      id: '10105'
      position:
        x: 1480
        y: 45
      positionAbsolute:
        x: 1480
        y: 45
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        template: 没有检索到相关手册片段。请补充设备型号或换一个与设备点检有关的问题。
        title: 未命中提示
        type: template-transform
        variables: []
      height: 105
      id: '10106'
      position:
        x: 880
        y: 330
      positionAbsolute:
        x: 880
        y: 330
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '10105'
          - answer
          variable: answer
        - value_selector:
          - '10103'
          - sources
          variable: sources
        title: 输出回答与依据
        type: end
      height: 105
      id: '10107'
      position:
        x: 1780
        y: 45
      positionAbsolute:
        x: 1780
        y: 45
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '10106'
          - output
          variable: answer
        title: 输出未命中提示
        type: end
      height: 105
      id: '10108'
      position:
        x: 1180
        y: 330
      positionAbsolute:
        x: 1180
        y: 330
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 25
      y: 65
      zoom: 0.58
  rag_pipeline_variables: []
